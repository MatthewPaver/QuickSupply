name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SESSION_SECRET: ci-session-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Route smoke tests
        run: |
          PORT=3000 pnpm start > /tmp/quicksupply-start.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/ >/dev/null
          pnpm e2e:routes

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicksupply-start-log
          path: /tmp/quicksupply-start.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Print app logs on failure
        if: failure()
        run: |
          if [ -f /tmp/quicksupply-start.log ]; then
            tail -n 200 /tmp/quicksupply-start.log
          fi
