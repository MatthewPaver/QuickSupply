name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SESSION_SECRET: ci-session-secret-not-for-production
      DATABASE_URL: /tmp/quicksupply-ci.db
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Route smoke tests
        run: |
          PORT=3000 pnpm start > /tmp/quicksupply-start.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/ >/dev/null
          pnpm e2e:routes

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Full booking browser flow
        run: |
          PORT=3100 pnpm start > /tmp/quicksupply-e2e.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3100 pnpm exec playwright test e2e/full-demo-flow.spec.ts e2e/offline-navigation.spec.ts

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quicksupply-start-log
          path: |
            /tmp/quicksupply-start.log
            /tmp/quicksupply-e2e.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Print app logs on failure
        if: failure()
        run: |
          if [ -f /tmp/quicksupply-start.log ]; then
            tail -n 200 /tmp/quicksupply-start.log
          fi
